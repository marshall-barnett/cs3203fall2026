name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - release

jobs:
  validate:
    name: Validate Python project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Check Python syntax
        run: python -m compileall .

      - name: Run smoke validation
        shell: bash
        run: |
          python - <<'PY'
import csv
from pathlib import Path

csv_path = Path("books.csv")
with csv_path.open(newline="", encoding="utf-8") as f:
    rows = list(csv.DictReader(f))

assert rows, "No book records found in books.csv"
assert all("price" in row for row in rows), "Each row must contain a price field"
print(f"Smoke test passed for {len(rows)} records.")
PY
